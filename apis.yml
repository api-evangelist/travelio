description: Travelio is one of Indonesia's largest online property rental and management
  platforms, operated by PT Horizon Internusa Persada. It lists furnished and unfurnished
  apartments, houses, villas, guest houses, and hotel residences for daily, monthly,
  and yearly rental across 15+ Indonesian cities including Jakarta, Bandung, Surabaya,
  Bali, and Yogyakarta, and offers hospitality-grade property management for owners.
  Backed by 500 Global, Travelio runs consumer web and mobile apps but publishes no
  public developer API, SDK, partner integration surface, or developer portal as of
  this profile.
